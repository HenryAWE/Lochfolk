name: Build

on: [push, pull_request]

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  MSVC:
    name: Windows MSVC
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        kind: [static, shared]
        include:
          - kind: static
            shared: "OFF"
          - kind: shared
            shared: "ON"

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -Dlochfolk_prefer_system_gtest=OFF

      - name: Build
        run: cmake --build build --verbose

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Install
        run: |
          cmake --install build --prefix install
          if (-not (Test-Path "install/include/lochfolk")) { throw "public headers were not installed" }
          Get-ChildItem install

  Clang:
    name: Linux Clang 18
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [static, shared]
        include:
          - kind: static
            shared: "OFF"
          - kind: shared
            shared: "ON"

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 libgtest-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -Dlochfolk_enable_asan=ON

      - name: Build
        run: cmake --build build --verbose

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Install
        run: |
          cmake --install build --prefix install
          ls install/lib
          ls install/include/lochfolk

  GCC:
    name: Linux GCC 14
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [static, shared]
        include:
          - kind: static
            shared: "OFF"
          - kind: shared
            shared: "ON"

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-14 g++-14 libgtest-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build --verbose

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Install
        run: |
          cmake --install build --prefix install
          ls install/lib
          ls install/include/lochfolk

  macOS:
    name: macOS arm64 (AppleClang)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        kind: [static, shared]
        include:
          - kind: static
            shared: "OFF"
          - kind: shared
            shared: "ON"

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: brew install ninja googletest

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"

      - name: Build
        run: cmake --build build --verbose

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Install
        run: |
          cmake --install build --prefix install
          ls install/lib
          ls install/include/lochfolk
